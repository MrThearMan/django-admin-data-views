[project]
name = "django-admin-data-views"
version = "0.4.3"
description = "Add custom data views to django admin panel."
authors = [
    { name = "Matti Lamppu", email = "lamppu.matti.akseli@gmail.com" },
]
license = "MIT"
readme = "README.md"
keywords = [
    "django",
    "admin",
    "panel",
    "custom",
    "views",
    "data",
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Natural Language :: English",
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.17",
    "django-settings-holder>=0.2.0",
]

[project.urls]
"Homepage" = "https://mrthearman.github.io/django-admin-data-views"
"Repository" = "https://github.com/MrThearMan/django-admin-data-views"
"Bug Tracker" = "https://github.com/MrThearMan/django-admin-data-views/issues"
"Documentation" = "https://mrthearman.github.io/django-admin-data-views"

[dependency-groups]
# Development installs the library, so that "uv run" needs no extra flags.
dev = [
    "django-admin-data-views",
]
test = [
    "pytest==9.1.1",
    "coverage==7.16.2",
    "pytest-django==4.14.0",
    "nox==2026.8.17",
    "beautifulsoup4==4.15.0",
]
docs = [
    "zensical==0.0.69",
    "pymdown-extensions==12.1",
    "pygments==2.21.0",
]
lint = [
    "prek==0.5.5",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "django-stubs==6.1.2",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
# Lets the "dev" group name this project.
django-admin-data-views = { workspace = true }

[tool.uv.build-backend]
# The package is at the repository root, not under "src".
module-root = ""
module-name = [
    "admin_data_views",
]

[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
]
exclude = [
    "^tests/",
    "^docs/",
    "^site/",
]

[tool.django-stubs]
django_settings_module = "example_project.project.settings"

[tool.coverage.run]
relative_files = true
branch = true
include = [
    "admin_data_views/*",
]

[tool.coverage.report]
fail_under = 100
exclude_also = [
    'if TYPE_CHECKING:',
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example_project.project.settings"
filterwarnings = [
    "error",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
